name: Publish verified Android download
# Temporary, explicitly approved delivery workflow; remove after verifying the release.

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-android-download.yml]

permissions: {}

concurrency:
  group: android-preview-download
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'blsmohamme972-lab/sketcy-CTVs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify the successful CI artifact and publish its APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import hashlib
          import io
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          repository = os.environ["GH_REPO"]
          source = "b0f7cc6f512b26d260a9a07cdd8e5668ac9ac92e"
          run_id = 41126878920
          artifact_id = 13011995495
          archive_sha = "984b0c05cee33d31bc8d47499c0991a8dd44983baaec6438545f6706be3d621c"
          tag = "v0.2.0-android-preview"
          name = "Sketcy-CTVS-0.2.0.apk"
          base = "https://api.github.com/repos/" + repository
          maximum = 64 * 1024 * 1024

          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None and urllib.parse.urlsplit(newurl).hostname != urllib.parse.urlsplit(req.full_url).hostname:
                      redirected.remove_header("Authorization")
                  return redirected

          opener = urllib.request.build_opener(SafeRedirect())

          def request(path, method="GET", value=None, raw=None, content_type="application/json"):
              url = path if path.startswith("https://") else base + path
              if urllib.parse.urlsplit(url).hostname not in {"api.github.com", "uploads.github.com"}:
                  raise RuntimeError("Unexpected API host")
              headers = {
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "sketcy-verified-apk-delivery",
              }
              data = raw if raw is not None else json.dumps(value).encode() if value is not None else None
              if data is not None:
                  headers["Content-Type"] = content_type
              with opener.open(urllib.request.Request(url, data=data, headers=headers, method=method), timeout=120) as response:
                  body = response.read(maximum + 1)
                  if len(body) > maximum:
                      raise RuntimeError("Response exceeds delivery size limit")
                  return body

          def api(path, method="GET", value=None):
              return json.loads(request(path, method=method, value=value))

          run = api("/actions/runs/" + str(run_id))
          if run["conclusion"] != "success" or run["head_sha"] != source or run["event"] != "push":
              raise RuntimeError("Source CI run is not the pinned successful push")
          artifact = api("/actions/artifacts/" + str(artifact_id))
          if artifact["expired"] or artifact["workflow_run"]["head_sha"] != source or artifact["digest"] != "sha256:" + archive_sha:
              raise RuntimeError("Artifact provenance mismatch")
          archive = request("/actions/artifacts/" + str(artifact_id) + "/zip")
          if hashlib.sha256(archive).hexdigest() != archive_sha:
              raise RuntimeError("Artifact download checksum mismatch")
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              candidates = [entry for entry in bundle.infolist() if entry.filename.endswith("/apk/debug/app-debug.apk")]
              if len(candidates) != 1 or candidates[0].file_size > maximum:
                  raise RuntimeError("Expected exactly one bounded app debug APK")
              apk = bundle.read(candidates[0])
          with zipfile.ZipFile(io.BytesIO(apk)) as package:
              if sum(entry.file_size for entry in package.infolist()) > maximum or package.testzip() is not None:
                  raise RuntimeError("APK ZIP integrity check failed")
              if not {"AndroidManifest.xml", "classes.dex"}.issubset(package.namelist()):
                  raise RuntimeError("APK is missing Android entry files")

          temporary = pathlib.Path(tempfile.mkdtemp(prefix="sketcy-verified-release-"))
          local_apk = temporary / name
          local_apk.write_bytes(apk)
          sdk = pathlib.Path(os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk"))
          tools = sorted((sdk / "build-tools").glob("*/apksigner"))
          if not tools:
              raise RuntimeError("Android build tools are required for signature verification")
          build_tools = tools[-1].parent
          signing = subprocess.check_output([str(build_tools / "apksigner"), "verify", "--verbose", "--print-certs", str(local_apk)], text=True)
          badging = subprocess.check_output([str(build_tools / "aapt"), "dump", "badging", str(local_apk)], text=True)
          subprocess.run([str(build_tools / "zipalign"), "-c", "-p", "4", str(local_apk)], check=True)
          for required in ["name='com.sketcy.ctvs'", "versionCode='2'", "versionName='0.2.0'", "sdkVersion:'26'", "targetSdkVersion:'35'"]:
              if required not in badging:
                  raise RuntimeError("APK identity mismatch: " + required)
          if "android.permission.INTERNET" in badging:
              raise RuntimeError("Unexpected Internet permission")
          certificate = next(line.split(": ", 1)[1] for line in signing.splitlines() if "certificate SHA-256 digest:" in line)
          sha = hashlib.sha256(apk).hexdigest()
          evidence = {
              "source_commit": source,
              "source_ci_run": run_id,
              "source_artifact_id": artifact_id,
              "source_artifact_sha256": archive_sha,
              "apk_name": name,
              "apk_bytes": len(apk),
              "apk_sha256": sha,
              "debug_certificate_sha256": certificate,
              "checks": ["source CI success", "artifact SHA-256", "APK ZIP CRC", "apksigner verify", "zipalign", "Android package identity"],
              "runtime_validation": "Not completed. Earlier software-emulator installation timed out; no instrumented or physical-device pass is claimed.",
              "signing": "CI debug certificate; may differ from the earlier chat-delivered debug APK.",
          }
          notes = (
              "Android 8+ personal-testing APK from the successful CI run "
              "https://github.com/" + repository + "/actions/runs/" + str(run_id) + ".\n\n"
              "Download **" + name + "** under Assets, or use its direct browser download link. "
              "This app starts with an empty library and contains no medical lessons, narration or model weights.\n\n"
              "This is a debug-signed preview. Device installation/playback acceptance and human listening review remain open. "
              "The earlier software emulator did not finish installation. "
              "Physical-device installation acceptance remains open.\n\n"
              "This CI APK may use a different debug certificate from earlier local builds. "
              "If an older build is already installed, export a backup before changing signing identities; "
              "uninstalling an app removes its private data.\n\n"
              "APK SHA-256: `" + sha + "`\n\n"
              "APK bytes: " + str(len(apk)) + "\n\n"
              "Debug certificate SHA-256: `" + certificate + "`\n"
          )
          try:
              release = api("/releases/tags/" + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              release = api("/releases", "POST", {
                  "tag_name": tag,
                  "target_commitish": source,
                  "name": "Sketcy CTVS 0.2.0 — Android preview",
                  "body": notes,
                  "draft": True,
                  "prerelease": True,
                  "make_latest": "false",
              })
          if release["target_commitish"] != source or not release["prerelease"]:
              raise RuntimeError("Existing release belongs to different source or release type")
          assets = {asset["name"]: asset for asset in release["assets"]}
          payloads = [
              (name, apk, "application/vnd.android.package-archive"),
              ("SHA256SUMS.txt", (sha + "  " + name + "\n").encode(), "text/plain"),
              ("APK-VERIFICATION.json", (json.dumps(evidence, indent=2) + "\n").encode(), "application/json"),
          ]
          for filename, body, mime in payloads:
              expected = "sha256:" + hashlib.sha256(body).hexdigest()
              if filename in assets:
                  if assets[filename].get("digest") != expected or assets[filename]["size"] != len(body):
                      raise RuntimeError("Refusing to overwrite an existing different release asset")
                  continue
              if not release["draft"]:
                  raise RuntimeError("Refusing to modify an already published release")
              upload = release["upload_url"].split("{", 1)[0] + "?" + urllib.parse.urlencode({"name": filename})
              asset = json.loads(request(upload, method="POST", raw=body, content_type=mime))
              if asset.get("digest") != expected or asset["size"] != len(body):
                  raise RuntimeError("Uploaded release asset checksum mismatch")
              assets[filename] = asset
          if release["draft"]:
              release = api("/releases/" + str(release["id"]), "PATCH", {"draft": False, "make_latest": "false"})
          print(json.dumps(evidence, indent=2))
          print("Direct APK download:", assets[name]["browser_download_url"])
