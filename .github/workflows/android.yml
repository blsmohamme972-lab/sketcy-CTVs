name: Android checks and APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: CPU benchmark tooling tests (no model download)
        run: python3 -m unittest discover -s tools/breeze -p 'test_*.py' -v
      - name: Production tooling tests (no medical sources or generated media)
        run: python3 -m unittest discover -s tools/production -p 'test_*.py' -v
      - name: JVM tests, Android build, instrumented-test build, and lint
        run: ./gradlew :lesson-model:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Save installable debug APK and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sketcy-debug-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            lesson-model/build/reports/tests/test/
            lesson-model/build/test-results/test/
