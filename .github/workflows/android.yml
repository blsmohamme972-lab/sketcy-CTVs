name: Android checks and APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Android command-line tools, platform and build tools
        run: |
          sketcy_sdk="$RUNNER_TEMP/sketcy-android-sdk"
          sketcy_cli="$RUNNER_TEMP/sketcy-commandlinetools.zip"
          curl --fail --location --retry 3 --output "$sketcy_cli" https://dl.google.com/android/repository/commandlinetools-linux-11479570_latest.zip
          printf '%s  %s\n' '9673a4b9bdfc49a26022b047af0b8a91da74ed951ffd7dbe04181bce36980e6d' "$sketcy_cli" | sha256sum --check -
          mkdir -p "$sketcy_sdk/cmdline-tools"
          unzip -q "$sketcy_cli" -d "$RUNNER_TEMP/sketcy-cli-unpacked"
          mv "$RUNNER_TEMP/sketcy-cli-unpacked/cmdline-tools" "$sketcy_sdk/cmdline-tools/13.0"
          python3 -c 'print("y\n" * 100)' > "$RUNNER_TEMP/sketcy-sdk-license-answers.txt"
          "$sketcy_sdk/cmdline-tools/13.0/bin/sdkmanager" --sdk_root="$sketcy_sdk" 'platforms;android-35' 'build-tools;34.0.0' < "$RUNNER_TEMP/sketcy-sdk-license-answers.txt"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sketcy_sdk" "$sketcy_sdk" >> "$GITHUB_ENV"
      - name: CPU benchmark tooling tests (no model download)
        run: python3 -m unittest discover -s tools/breeze -p 'test_*.py' -v
      - name: Production tooling tests (no medical sources or generated media)
        run: python3 -m unittest discover -s tools/production -p 'test_*.py' -v
      - name: JVM tests, Android build, instrumented-test build, and lint
        run: ./gradlew :lesson-model:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Save installable debug APK and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sketcy-debug-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            lesson-model/build/reports/tests/test/
            lesson-model/build/test-results/test/
